services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doggo
      POSTGRES_PASSWORD: doggo
      POSTGRES_DB: doggo
    ports:
      - "5432:5432"
    volumes:
      - doggo-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - doggo-redis:/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - doggo-minio:/data
volumes:
  doggo-postgres:
  doggo-redis:
  doggo-minio:
